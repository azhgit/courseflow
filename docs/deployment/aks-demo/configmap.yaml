apiVersion: v1
kind: ConfigMap
metadata:
  name: courseflow-config
  namespace: courseflow
data:
  CORS_ORIGINS: "*"
  RATE_LIMIT_RPM: "15"
  DATABASE_URL: "sqlite+aiosqlite:///./data/courseflow.db"
  CHROMA_PERSIST_DIR: "./data/chroma"
  QUOTA_HOURLY_LIMIT: "100"
  QUOTA_DAILY_BUDGET: "300"
  LOCAL_UNLIMITED: "false"
