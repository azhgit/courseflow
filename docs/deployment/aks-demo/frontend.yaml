apiVersion: apps/v1
kind: Deployment
metadata:
  name: courseflow-frontend
  namespace: courseflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: courseflow-frontend
  template:
    metadata:
      labels:
        app: courseflow-frontend
    spec:
      containers:
        - name: courseflow-frontend
          image: courseflowacr.azurecr.io/courseflow-frontend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: courseflow-frontend
  namespace: courseflow
spec:
  type: LoadBalancer
  selector:
    app: courseflow-frontend
  ports:
    - port: 80
      targetPort: 80
