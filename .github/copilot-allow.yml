# Copilot auto-skills allow list (production-ready template)
# Edit values below to match your security policy before enabling automatic skills.

allow_auto_skills: true
require_manual_confirm: true  # Keep true for safety; set false only if fully trusted

# Explicitly allowed skills (only these skills may be auto-run)
allowed_skills:
  - rag-implementation
  - architecture-patterns
  - debugging-strategies
  - prompt-engineering-patterns
  - using-superpowers
  - find-skills
  - senior-architect
  - api-design-principles
  - skill-writer
  - systematic-debugging
  - frontend-design
  - microservices-patterns

# Optional: allow only specific MCP servers by name
allowed_mcp_servers:
  - sequential
  - filesystem
  - brave-search
  - fetch
  - memory
  - context7

# Operational policy
# - All automatic executions will still write a PR with the changes and a detailed run log
# - If require_manual_confirm: true the Assistant will request explicit "確定" approval before executing
# - For CI/automation, make sure the runner environment provides a GH_TOKEN with limited scope

audit:
  record_runs_to: ".github/copilot-auto-skills-runs.log"  # location to append run summaries (optional)
  include_output_excerpt: true

# Notes:
# - Before enabling, ensure copilot CLI is installed and authenticated on the target host.
# - Use /add-dir in Copilot CLI to whitelist repository paths for file access.
# - Do NOT enable allow_auto_skills without reviewing allowed_skills and allowed_mcp_servers.
