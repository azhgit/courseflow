[project]
name = "courseflow"
version = "0.1.0"
description = "Basic RAG Question Answering System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "chromadb>=0.4.22",
    "aiosqlite>=0.19.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "google-generativeai>=0.3.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "pymupdf>=1.27.0",
    "tiktoken>=0.12.0",
    "nltk>=3.9.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "httpx>=0.26.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"tests/**/*.py" = ["B011"]  # assert False

[tool.mypy]
python_version = "3.11"
# Relaxed strict mode for pragmatic development
warn_return_any = false  # Too many false positives with Pydantic/ChromaDB
warn_unused_configs = true
disallow_untyped_defs = false  # Allow gradual typing
disallow_any_generics = false  # ChromaDB has complex generics
check_untyped_defs = false  # Disable to avoid interface mismatch errors
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false  # Avoid churn on type: ignore comments
warn_no_return = true
strict_equality = true
mypy_path = "src"
ignore_errors = false

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "google.generativeai.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "courseflow.infrastructure.*",
    "courseflow.application.*",
    "courseflow.api.*",
]
# Relax type checking for infrastructure layer due to complex third-party types
disable_error_code = ["arg-type", "override", "index", "return-value", "call-arg", "misc", "assignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/courseflow",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["src/courseflow"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
